version: '3.8'

services:
    postgres:
        build:
            context: .
            dockerfile: docker/postgres/Dockerfile
        container_name: webwings-postgres
        restart: always
        volumes:
            - webwings_postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: $DB_NAME
            POSTGRES_USER: $DB_USERNAME
            POSTGRES_PASSWORD: $DB_PASSWORD
        ports:
            - '${DB_PORT}:5432'
        networks:
            - webwings-network

    app:
        build:
            context: .
            dockerfile: docker/apps/Dockerfile
        container_name: web-apps
        networks:
            - webwings-network
networks:
    webwings-network:

volumes:
    webwings_postgres_data:
